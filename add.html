<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add FD — FD Maturity & Renewal Manager</title>
    <style>
        :root {
            --navy: #10243e; --bg: #f5f6f8; --card: #ffffff; --text: #1c2733;
            --muted: #6b7684; --border: #e2e5ea;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--navy); color: white; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        header h1 { font-size: 20px; margin: 0; font-weight: 600; }
        header nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; padding: 8px 14px; border-radius: 6px; background: rgba(255,255,255,0.08); }
        header nav a:hover { background: rgba(255,255,255,0.18); }
        main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; max-width: 520px; }
        .top-actions { margin-bottom: 20px; }
        .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
        .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        .btn { display: inline-block; padding: 9px 16px; border-radius: 6px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn-primary { background: var(--navy); color: white; }
        .btn-secondary { background: transparent; color: var(--navy); border: 1px solid var(--border); }
    </style>
</head>
<body>
    <header>
        <h1>FD Maturity &amp; Renewal Manager</h1>
        <nav>
            <a href="index.html">All FDs</a>
            <a href="index.html">Maturing Soon</a>
            <a href="add.html">+ Add FD</a>
        </nav>
    </header>
    <main>
        <div class="top-actions">
            <strong style="font-size:18px;">Add a Fixed Deposit</strong>
            <div class="subtitle">Quarterly compounding is applied automatically.</div>
        </div>

        <div class="card">
            <form onsubmit="return false;">
                <div class="field">
                    <label for="customer">Customer name</label>
                    <input type="text" id="customer" name="customer" required>
                </div>
                <div class="field">
                    <label for="account_no">FD account number</label>
                    <input type="text" id="account_no" name="account_no" required>
                </div>
                <div class="field">
                    <label for="principal">Principal amount (₹)</label>
                    <input type="number" id="principal" name="principal" min="1" step="0.01" required>
                </div>
                <div class="field">
                    <label for="rate">Annual interest rate (%)</label>
                    <input type="number" id="rate" name="rate" min="0" step="0.01" required>
                </div>
                <div class="field">
                    <label for="start_date">Start date</label>
                    <input type="date" id="start_date" name="start_date" required>
                </div>
                <div class="field">
                    <label for="tenure_years">Tenure (years, e.g. 1.5 for 18 months)</label>
                    <input type="number" id="tenure_years" name="tenure_years" min="0.01" step="0.01" required>
                </div>
                <div class="field">
                    <label for="penalty_rate">Premature closure penalty rate (%, optional)</label>
                    <input type="number" id="penalty_rate" name="penalty_rate" min="0" step="0.01" value="1.0">
                </div>
                <button type="submit" class="btn btn-primary">Save FD</button>
                <a href="index.html" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </main>
</body>
</html>
