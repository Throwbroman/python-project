<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FD Maturity & Renewal Manager</title>
    <style>
        :root {
            --navy: #41691c;
            --gold: #c8963e;
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #1c2733;
            --muted: #6b7684;
            --danger: #b3352c;
            --success: #1e7145;
            --border: #e2e5ea;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            background: var(--navy);
            color: white;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        header h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        header nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
        }
        header nav a:hover { background: rgba(255,255,255,0.18); }
        main {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 24px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        tr.maturing-soon { background: #fff7e6; }
        tr.status-closed { opacity: 0.6; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-active { background: #e5f3ea; color: var(--success); }
        .badge-soon { background: #fdecc8; color: #8a5b00; }
        .badge-matured { background: #eee; color: var(--muted); }
        .badge-closed { background: #f7e3e1; color: var(--danger); }
        .btn {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-primary { background: var(--navy); color: white; }
        .btn-primary:hover { background: #0b1a2d; }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: #fbeceb; }
        .btn-secondary { background: transparent; color: var(--navy); border: 1px solid var(--border); }
        form.inline { display: inline; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
        .field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }
        .flash { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #e5f3ea; color: var(--success); }
        .flash-error { background: #f7e3e1; color: var(--danger); }
        .empty-state { text-align: center; padding: 48px 16px; color: var(--muted); }
        .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
    </style>
</head>
<body>
    <header>
        <h1>FD Maturity &amp; Renewal Manager</h1>
        <nav>
            <a href="{{ url_for('home') }}">All FDs</a>
            <a href="{{ url_for('maturing_soon') }}">Maturing Soon</a>
            <a href="{{ url_for('add_fd') }}">+ Add FD</a>
        </nav>
    </header>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
